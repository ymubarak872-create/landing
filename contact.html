<body>
<header class="site-bar">
  <div class="container bar-inner">
    <a class="brand" href="index.html">NovaLaunch</a>

      <!-- NAV MENU -->
      <nav>
      <ul class="nav-menu" id="navMenu">
        <li><a class="nav-item" href="index.html">Home</a></li>
        <li><a class="nav-item" href="features.html">Features</a></li>

      </ul>
      </nav>
  </div>
</header>

<section class="section" id="contact">
      <div class="container">
        <div class="contact-wrap reveal">
          <div class="contact-left">
            <h2>Let’s build your website</h2>
            <p class="muted">
              Fill the form. We’ll reply within 24 hours. You can also request a custom design.
            </p>

            <div class="contact-info">
              <div><strong>Email:</strong> info@example.com</div>
              <div><strong>Phone:</strong> +234 800 000 0000</div>
              <div><strong>Location:</strong> Lagos, Nigeria</div>
            </div>
          </div>

          <form class="contact-form" id="contactForm">
            <p id="formMessage"></p>
            <div class="field">
              <label for="name">Full Name</label>
              <input id="name" type="text" placeholder="Your name" required />
            </div>

            <div class="field">
              <label for="email">Email</label>
              <input id="email" type="email" placeholder="you@email.com" required />
            </div>

            <div class="field">
              <label for="message">Message</label>
              <textarea id="message" rows="5" placeholder="Tell us about your project..." required></textarea>
            </div>

            <button class="btn btn-primary w-full" type="submit">
              Send Message
            </button>

            <p class="form-note" id="formNote" aria-live="polite"></p>
          </form>
        </div>
      </div>
    </section>

  </main>
<footer class="site-footer"></footer>
<script src="script.js"></script>
</body>
</html>
