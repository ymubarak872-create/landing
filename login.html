<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — NovaLaunch</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<header class="site-bar">
  <div class="container bar-inner">
    <a class="brand" href="index.html">NovaLaunch</a>

      <!-- NAV MENU -->
      <nav>
      <ul class="nav-menu" id="navMenu">
        <li><a class="nav-item" href="index.html">Home</a></li>
        <li><a class="nav-item" href="features.html">Features</a></li>
        <li><a class="nav-item" href="services.html">Services</a></li>
        <li><a class="nav-item" href="pricing.html">Pricing</a></li>
        <li><a class="nav-item" href="testimonials.html">Testimonials</a></li>
        <li><a class="nav-item" href="contact.html">Contact</a></li>
        <li><a class="nav-item active" href="login.html">Login</a></li>
      </ul>
      </nav>
  </div>
</header>

<main class="login-section">
  <div class="login-panel">
    <h1>Sign in to NovaLaunch</h1>
    <p class="section-desc">Enter your credentials to access the user or admin dashboard.</p>

    <form id="loginForm">
      <div class="login-field">
        <label for="email">Email</label>
        <input id="email" type="email" required placeholder="admin@example.com" />
      </div>
      <div class="login-field">
        <label for="password">Password</label>
        <input id="password" type="password" required placeholder="admin123" />
      </div>
      <button class="btn btn-primary btn-block" type="submit">Login</button>
      <p class="login-error" id="loginError"></p>
    </form>

    <div class="login-hint">
      <strong>Admin:</strong> admin@example.com / admin123<br />
      <strong>User:</strong> user@example.com / user123
    </div>
  </div>
</main>

<script src="login.js"></script>
</body>
</html>
